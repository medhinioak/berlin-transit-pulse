[project]
name = "btp-processor"
version = "0.1.0"
description = "Stop-event processor: turns trip-update predictions into stop events."
requires-python = ">=3.12"
dependencies = ["btp-common"]

[tool.uv.sources]
btp-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
