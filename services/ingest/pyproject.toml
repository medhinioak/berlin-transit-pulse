[project]
name = "btp-ingest"
version = "0.1.0"
description = "Ingest service: polls the VBB GTFS-RT feed and publishes changed trips."
requires-python = ">=3.12"
dependencies = ["btp-common"]

[tool.uv.sources]
btp-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
