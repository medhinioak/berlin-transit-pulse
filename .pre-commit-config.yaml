repos:
  # ruff runs from the uv environment, so the hook and `make lint` use the version in uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # Uses compose's custom tag !reset; `docker compose … config` validates it instead.
        exclude: ^deploy/compose/compose\.release\.yaml$
      - id: check-added-large-files
        args: [--maxkb=1024]  # keeps raw feed snapshots out of Git
      - id: detect-private-key
