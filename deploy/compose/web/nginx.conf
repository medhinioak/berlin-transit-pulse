# Serves web/ and proxies /api/ to metrics-api (#10). Replaces the image's nginx.conf.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json;

  # Docker's DNS, re-resolved at request time: nginx starts and keeps running while
  # metrics-api is down or gets a new IP, and answers 502 meanwhile.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Cache-Control by path; an empty value sends no header (the API sets its own).
  map $uri $cache_control {
    default "";
    /index.html "no-cache";
    ~\.(?:js|css)$ "public, max-age=300";  # file names aren't versioned, so keep it short
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cache-Control $cache_control always;
    # Only this origin: no CDN, fonts, analytics or embeds.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
      set $api_upstream http://metrics-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Server;
      proxy_connect_timeout 10s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
    }

    # Only the page and its assets; web/ also holds README.md, which isn't served.
    location / {
      try_files $uri $uri/ =404;
    }

    location ~* \.md$ {
      return 404;
    }
  }
}
