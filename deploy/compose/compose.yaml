# Local platform and release stack: one Kafka broker (KRaft) and Postgres 16.
# Memory limits fit the 2 GB t4g.small release server. See README.md in this folder.
name: btp

services:
  kafka:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: TDWqVeZ8SYiwiNzQa7B0Zw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      # 127.0.0.1, not localhost: the host port is bound to IPv4 only, and clients that resolve
      # localhost to ::1 first get refused and back off until messages time out (troubleshooting).
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker: internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by kafka-init only, so a typo in a topic name fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms384m -Xmx512m
    mem_limit: 768m
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # The CLI starts its own JVM; without a small heap it inherits the broker's 384-512 MB
      # and can push the container over its memory limit.
      test:
        - CMD-SHELL
        - >-
          KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 > /dev/null
      # Each check is a JVM start (~1.5 s of CPU): every 5 s while starting, then once a minute,
      # so it doesn't drain the t4g.small's CPU credits. start_interval needs Docker Engine 25+.
      start_period: 60s
      start_interval: 5s
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    mem_limit: 256m
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server=kafka:9092
      - --create
      - --if-not-exists
      - --topic=trip-updates
      - --partitions=6
      - --replication-factor=1
      - --config=retention.ms=86400000
      - --config=cleanup.policy=delete
    restart: "no"

  postgres:
    image: postgres:16.16
    command: postgres -c shared_buffers=128MB
    environment:
      POSTGRES_DB: btp
      POSTGRES_PASSWORD: ${BTP_PG_SUPERUSER_PASSWORD:-dev_superuser}
      # Read by postgres/init/01_schemas_roles.sql on first start.
      BTP_PG_PROCESSOR_PASSWORD: ${BTP_PG_PROCESSOR_PASSWORD:-dev_processor}
      BTP_PG_SCHEDULE_PASSWORD: ${BTP_PG_SCHEDULE_PASSWORD:-dev_schedule}
      BTP_PG_METRICS_JOBS_PASSWORD: ${BTP_PG_METRICS_JOBS_PASSWORD:-dev_metrics_jobs}
      BTP_PG_API_PASSWORD: ${BTP_PG_API_PASSWORD:-dev_api}
    mem_limit: 512m
    # Docker's default /dev/shm is 64 MB; parallel queries and large sorts need more.
    shm_size: 128m
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first start the entrypoint runs the init SQL on a socket-only
      # server, so a socket check would pass before the roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d btp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: imports the static GTFS as a new version and activates it, then exits 0.
  # Re-running with an unchanged zip is a no-op. Imports the mini GTFS from fixtures/ by default,
  # with no network; BTP_FEED_MODE=live downloads the VBB static GTFS.
  schedule-import:
    build:
      context: ../..
      dockerfile: services/schedule/Dockerfile
    command: ["btp-schedule", "import", "--activate"]
    environment:
      BTP_SERVICE_NAME: schedule
      BTP_FEED_MODE: ${BTP_FEED_MODE:-fixtures}
      BTP_FEED_CONTACT: ${BTP_FEED_CONTACT:-https://github.com/medhinioak/berlin-transit-pulse}
      BTP_PG_HOST: postgres
      BTP_PG_SCHEDULE_PASSWORD: ${BTP_PG_SCHEDULE_PASSWORD:-dev_schedule}
      BTP_FIXTURES_DIR: /fixtures
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    volumes:
      - schedule-cache:/cache
      - ../../fixtures/gtfs-static/mini:/fixtures/gtfs-static/mini:ro
    restart: "no"

  # Polls the feed and publishes changed trips to trip-updates (schemas/trip-updates.md).
  # Replays the committed fixtures by default; BTP_FEED_MODE=live polls VBB (needs
  # BTP_FEED_CONTACT, at most one request per 30 s, see CLAUDE.md feed etiquette).
  ingest:
    build:
      context: ../..
      dockerfile: services/ingest/Dockerfile
    command: ["btp-ingest"]
    environment:
      BTP_SERVICE_NAME: ingest
      BTP_FEED_MODE: ${BTP_FEED_MODE:-fixtures}
      BTP_FIXTURE_SET: ${BTP_FIXTURE_SET:-rush-hour}
      BTP_FEED_CONTACT: ${BTP_FEED_CONTACT:-https://github.com/medhinioak/berlin-transit-pulse}
      BTP_KAFKA_BOOTSTRAP: kafka:9092
      BTP_FIXTURES_DIR: /fixtures
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    # A live request can take up to 20 s (timeout), longer than Docker's default 10 s.
    stop_grace_period: 30s
    volumes:
      - ../../fixtures/vbb-rt:/fixtures/vbb-rt:ro
    restart: unless-stopped

  # Consumes trip-updates and keeps the latest prediction per trip and stop in events.*
  # (services/stop-event-processor/README.md). Commits offsets only after the DB transaction.
  stop-event-processor:
    build:
      context: ../..
      dockerfile: services/stop-event-processor/Dockerfile
    command: ["btp-processor"]
    environment:
      BTP_SERVICE_NAME: processor
      BTP_KAFKA_BOOTSTRAP: kafka:9092
      BTP_PG_HOST: postgres
      BTP_PG_PROCESSOR_PASSWORD: ${BTP_PG_PROCESSOR_PASSWORD:-dev_processor}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  # One-shot: creates or replaces the marts views (services/metrics-jobs/sql/views/) as
  # btp_metrics_jobs, then exits 0. Waits up to 60 s for the processor to create events.*.
  metrics-jobs-apply:
    build:
      context: ../..
      dockerfile: services/metrics-jobs/Dockerfile
    command: ["btp-metrics-jobs", "apply-sql"]
    environment:
      BTP_SERVICE_NAME: metrics-jobs
      BTP_PG_HOST: postgres
      BTP_PG_METRICS_JOBS_PASSWORD: ${BTP_PG_METRICS_JOBS_PASSWORD:-dev_metrics_jobs}
    depends_on:
      schedule-import:
        condition: service_completed_successfully
      stop-event-processor:
        condition: service_started
    mem_limit: 128m
    restart: "no"

  # Read-only HTTP API over marts as btp_api (services/metrics-api/README.md). In fixtures
  # mode it pins the views' "now" to the recording time of BTP_FIXTURE_SET (ADR-0019).
  metrics-api:
    build:
      context: ../..
      dockerfile: services/metrics-api/Dockerfile
    command: ["btp-metrics-api"]
    environment:
      BTP_SERVICE_NAME: metrics-api
      BTP_HOST: 0.0.0.0
      BTP_PORT: 8000
      BTP_PG_HOST: postgres
      BTP_PG_API_PASSWORD: ${BTP_PG_API_PASSWORD:-dev_api}
      BTP_FEED_MODE: ${BTP_FEED_MODE:-fixtures}
      BTP_FIXTURE_SET: ${BTP_FIXTURE_SET:-rush-hour}
      BTP_AS_OF: ${BTP_AS_OF:-}
      BTP_FIXTURES_DIR: /fixtures
    depends_on:
      metrics-jobs-apply:
        condition: service_completed_successfully
    mem_limit: 128m
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../../fixtures/vbb-rt:/fixtures/vbb-rt:ro
    healthcheck:
      # Is the server up? Any HTTP answer counts: /health itself returns 503 when the feed
      # is stale, which is for monitoring, not a reason to fail `make up`.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
          except urllib.error.HTTPError:
              pass
      start_period: 20s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Static page web/ and a proxy from /api/ to metrics-api (#10). Starts and keeps serving
  # while metrics-api is down; the page then shows its error state.
  web:
    image: nginx:1.30.6-alpine
    depends_on:
      metrics-api:
        condition: service_started
    mem_limit: 64m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Services are added here by their issues. Pattern: like ingest above; services
  # that read the schedule views also wait for
  #   schedule-import:
  #     condition: service_completed_successfully

volumes:
  kafka-data:
  postgres-data:
  schedule-cache:
