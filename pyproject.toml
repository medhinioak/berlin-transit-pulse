[tool.uv.workspace]
members = ["services/*", "libs/*"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "confluent-kafka>=2.16.2",
    "psycopg[binary]>=3.3.9",
    "httpx>=0.28.1",
    "types-protobuf>=7.35.1.20260906",
    "types-boto3[s3]>=1.44.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lets isort treat every workspace package as first-party.
src = ["services/*/src", "libs/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "scripts"

# confluent_kafka.admin re-exports AdminClient, ConfigResource etc. without an __all__.
[[tool.mypy.overrides]]
module = "confluent_kafka.admin"
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["services", "libs", "scripts"]
# scripts/ holds standalone tools (no package); their tests import them by module name.
pythonpath = ["scripts"]
# importlib mode: every package has its own tests/test_smoke.py.
addopts = "-m 'not integration' --import-mode=importlib"
markers = [
    "unit: fast tests with no external services (the default)",
    "integration: needs the Docker services from `make up`",
]

[tool.coverage.run]
source = ["services", "libs", "scripts"]
omit = ["*/tests/*"]
